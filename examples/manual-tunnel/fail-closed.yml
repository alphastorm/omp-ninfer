# Install or merge into ~/.omp/agent/config.yml. In the launching shell:
# export PI_OPENAI_STATEFUL=1; omp --model ninfer-beta/q38-ninfer
retry:
  enabled: false
  modelFallback: false
  fallbackRevertPolicy: never
# The client is a hash-pinned upstream binary bound into the manifest. The generic startup check
# would advertise `omp update`, which replaces it outside the release procedure (issue #18).
startup:
  checkUpdate: false
# NInfer admits one request at a time and expires a waiting one after 30 s. OMP's async compaction
# writes the session's summary in a background request as it nears the compaction threshold, and
# without a limit the user's next turn queued behind it at the server: every attempt expired, and
# the turn failed once the summary outlasted OMP's resends (a 61 s RTX 4090 handoff did, EXP-072).
# With one request in flight per NInfer provider, that turn waits in OMP instead, which has no
# deadline, and the summary still runs while you read or type. Every provider id a documented
# route or the fleet declares is listed: OMP leaves a provider missing here unlimited.
providers:
  maxInFlightRequests:
    ninfer-beta: 1
    ninfer-native-4090: 1
    ninfer-main: 1
    ninfer-heavy: 1
