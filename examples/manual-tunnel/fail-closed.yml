# Install or merge into ~/.omp/agent/config.yml. In the launching shell:
# export PI_OPENAI_STATEFUL=1; omp --model ninfer-beta/q38-ninfer
retry:
  enabled: false
  modelFallback: false
  fallbackRevertPolicy: never
# The client is a hash-pinned upstream binary bound into the manifest. The generic startup check
# would advertise `omp update`, which replaces it outside the release procedure (issue #18).
startup:
  checkUpdate: false
# OMP's async compaction summarizes the session in a background request as it nears the
# compaction threshold. NInfer admits one request at a time, so the user's next turn waits behind
# it; each attempt expires at the runtime's 30 s admission deadline, and the turn fails once the
# summary outlasts OMP's resends (a 61 s RTX 4090 handoff did, EXP-072). Compact inline instead.
compaction:
  asyncEnabled: false
