# One OMP configuration spanning the two lanes v0.7.4 qualifies, with explicit per-lane roles.
# Merge into ~/.omp/agent/models.yml (do not overwrite existing providers). Each lane stays
# loopback-only on its own machine and is reached through an authenticated SSH local forward
# (examples/fleet/open-tunnels.sh). Model ids are the lanes' exact published ids; provider names
# identify each lane's role, not a capability claim. Before launching OMP: export PI_OPENAI_STATEFUL=1
#
#   ninfer-main/q38-ninfer    RTX 5090 container, v0.4.8 profile: the interactive lead session.
#                            Durable checkpoints, template-fork fanout, 131,072 context.
#   ninfer-heavy/qwen3.8-27b  RTX 4090 durable v0.2.1: long-context background workers (prefill
#                            chunk 2,048, 131,072 context, rk2v4-e8 KV). No sibling fanout reuse;
#                            one active request.
#   The RTX 3090 scout role is deferred with its GPU: RTX 3090 is not a v0.7.4 install lane, so
#   this fragment declares no scout provider. Its three-lane form stays available at the
#   immutable v0.7.2 tag, together with the legacy OMP 18.0.9 instructions for that lane.
#
# Every lane is one active request per qualified profile; the fleet's completed-work boundary is
# the measured receipt in docs/measurements/ (see docs/PERFORMANCE.md, EXP-016), not a throughput
# claim.
providers:
  ninfer-main:
    baseUrl: http://127.0.0.1:18191/v1
    api: openai-responses
    apiKey: '!cat "$HOME/.omp/agent/ninfer-5090.key"'
    authHeader: true
    models:
      - id: q38-ninfer
        name: Qwen3.8 27B NInfer RTX 5090 (fleet main, durable, fanout)
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, xhigh]
        input:
          - text
          - image
        supportsTools: true
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        contextWindow: 131072
        maxTokens: 32768
        compat:
          includeEncryptedReasoning: false
          supportsReasoningSummary: false
  ninfer-heavy:
    baseUrl: http://127.0.0.1:18192/v1
    api: openai-responses
    apiKey: '!cat "$HOME/.omp/agent/ninfer-4090.key"'
    authHeader: true
    models:
      - id: qwen3.8-27b
        name: Qwen3.8 27B NInfer RTX 4090 durable v0.2.1 (fleet heavy)
        api: openai-responses
        reasoning: true
        thinking:
          mode: effort
          efforts: [low, medium, xhigh]
        input:
          - text
        supportsTools: true
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        contextWindow: 131072
        maxTokens: 32768
        compat:
          includeEncryptedReasoning: false
          supportsReasoningSummary: false
