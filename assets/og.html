<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OMP NInfer — social preview</title>
<link rel="stylesheet" href="brand.css">
<style>
  .og { width: 1280px; height: 640px; padding: 54px 64px 48px; display: grid; grid-template-rows: 44px 1fr 34px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .og .wordmark { font-size: 36px; gap: 16px; }
  .og .wordmark img { width: 44px; height: 44px; }
  .og .label { font-size: 26px; }
  .hero { align-self: center; }
  h1 { margin: 0; font-size: 86px; line-height: 1.02; letter-spacing: -.045em; font-weight: 600; white-space: nowrap; }
  h1 span { color: var(--local-text); }
  .tagline { margin-top: 16px; color: var(--body); font-size: 34px; line-height: 1.2; letter-spacing: -.01em; }
  svg { display: block; margin-top: 34px; }
  svg text { font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 500; letter-spacing: .12em; fill: #b6bec7; }
  .og .status { font-size: 28px; gap: 16px; }
  .og .status .sep { margin: 0 8px; }
  .og .dot { width: 14px; height: 14px; }
  .og .kin { width: 12px; height: 12px; }
</style>
</head>
<body>
<div class="sheet og">
  <div class="top">
    <div class="wordmark"><img src="logo.svg" alt=""><span>OMP NInfer</span></div>
    <div class="label">Durable local inference for coding agents</div>
  </div>
  <div class="hero">
    <h1>Your coding session<br><span>should survive the process.</span></h1>
    <div class="tagline">Durable session state on your GPU.</div>
    <svg width="1152" height="112" viewBox="0 0 1152 112" role="img" aria-label="The server process stops and is restarted; the session continues through a checkpoint.">
      <text x="0" y="21">PROCESS</text>
      <text x="1152" y="21" text-anchor="end">RESTARTED</text>
      <rect x="150" y="5" width="350" height="16" rx="4" fill="#e8ecef"/>
      <rect x="612" y="5" width="350" height="16" rx="4" fill="#e8ecef"/>
      <line x1="512" y1="13" x2="600" y2="13" stroke="rgba(232,236,239,.34)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
      <line x1="556" y1="26" x2="556" y2="56" stroke="rgba(171,157,240,.7)" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
      <line x1="150" y1="82" x2="1124" y2="82" stroke="#8e7be8" stroke-width="7" stroke-linecap="round"/>
      <path d="M1120 67 L1146 82 L1120 97 Z" fill="#8e7be8"/>
      <circle cx="556" cy="82" r="27" fill="rgba(142,123,232,.18)" stroke="rgba(142,123,232,.6)" stroke-width="1.5"/>
      <circle cx="556" cy="82" r="12" fill="#ab9df0"/>
      <text x="0" y="91">SESSION</text>
    </svg>
  </div>
  <div class="status">
    <span class="dot"></span><span>Qualified on RTX 5090 · 4090 · 3090</span>
    <span class="sep">·</span>
    <span class="kin"></span><span class="quiet">companion to oh-my-pi</span>
  </div>
</div>
</body>
</html>
