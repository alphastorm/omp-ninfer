<!doctype html>
<html lang="en">
<head>
<title>OMP NInfer — banner</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060809; font-family: 'Space Grotesk', system-ui, sans-serif; }
  .grid { position: absolute; inset: 0; opacity: 0.5;
    background-image: linear-gradient(rgba(232,236,239,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(232,236,239,0.025) 1px, transparent 1px);
    background-size: 40px 40px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
</style>
<style>
  .banner { position: relative; width: 1280px; height: 320px; overflow: hidden; background: #060809;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .glow { position: absolute; left: 50%; top: 50%; width: 560px; height: 280px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(142,123,232,0.10) 0%, transparent 65%); }
  .lockup { position: relative; display: flex; align-items: center; gap: 26px; }
  .title { color: #E8ECEF; font-size: 46px; font-weight: 600; letter-spacing: -0.015em; }
  .tagline { position: relative; display: flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A939D; }
  .tagline .bracket { color: #3A434D; }
  .status { position: relative; display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.06em; color: #5F6870; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #8E7BE8; }
  .kin { width: 5px; height: 5px; border-radius: 50%; background: #F97316; }
  .edge { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(142,123,232,0.35), transparent); }
  .edge.top { top: 0; } .edge.bottom { bottom: 0; }
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="edge top"></div>
  <div class="lockup">
    <svg width="76" height="76" viewBox="0 0 96 96">
  <rect x="12" y="12" width="10" height="72" rx="2" fill="#E8ECEF"></rect>
  <rect x="22" y="43" width="26" height="10" rx="2" fill="#E8ECEF"></rect>
  <rect x="51" y="31" width="28" height="34" rx="2" fill="none" stroke="#E8ECEF" stroke-width="10"></rect>
  <circle cx="65" cy="48" r="8" fill="#8E7BE8"></circle>
    </svg>
    <div class="title">OMP NInfer</div>
  </div>
  <div class="tagline">
    <span class="bracket">[</span>
    <span>private qwen coding appliance for rtx 5090</span>
    <span class="bracket">]</span>
  </div>
  <div class="status">
    <span class="dot"></span>
    <span>v0.1.0-beta.1 &middot; invited &middot; one rtx 5090 &middot; linux/wsl2</span>
    <span style="color:#3A434D;">&middot;</span>
    <span class="kin"></span>
    <span>companion to oh-my-pi</span>
  </div>
  <div class="edge bottom"></div>
</div>
</body>
</html>
