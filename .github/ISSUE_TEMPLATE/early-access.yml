name: Request early access
description: Tell us which RTX lane and long-session workflow you want to try.
title: "[early access] "
labels:
  - early-access
body:
  - type: markdown
    attributes:
      value: |
        OMP NInfer is an invited-tester beta for one owner-operated GPU. This form is public.
        Do not include API keys, hostnames, usernames, private prompts, model outputs, or logs.

  - type: dropdown
    id: gpu
    attributes:
      label: GPU lane
      description: Choose the card you want to use for the beta.
      options:
        - NVIDIA GeForce RTX 5090
        - NVIDIA GeForce RTX 4090
        - NVIDIA GeForce RTX 3090
        - Planning a build or upgrade
        - Another GPU (not currently qualified)
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Inference host
      options:
        - Windows 11 with Docker Desktop / WSL2
        - Native Windows 11
        - Native Ubuntu 24.04
        - Not decided yet
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: What would a great first session prove for you?
      description: A sentence or two is enough. Keep project and customer details generic.
      placeholder: "Example: Continue a multi-hour OMP refactor without re-prefilling the full transcript on every turn."
    validations:
      required: true

  - type: dropdown
    id: omp
    attributes:
      label: Oh My Pi experience
      options:
        - I use OMP now
        - I am evaluating OMP
        - I am new to OMP
    validations:
      required: true

  - type: checkboxes
    id: boundary
    attributes:
      label: Public-report boundary
      options:
        - label: I will keep this issue content-safe and use the exact quickstart/receipt for my selected lane.
          required: true
