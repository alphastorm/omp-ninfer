name: Hardware qualification report
description: Report acceptance evidence or a compatibility observation from an exact GPU lane
title: "[hardware]: "
labels:
  - community
body:
  - type: markdown
    attributes:
      value: |
        Report only content-safe system facts. Do not include API keys, usernames, hostnames, IP addresses, private paths, prompts, model output, raw logs, session files, Docker inspection dumps, or source code unless you deliberately choose to publish content you own after redaction.
  - type: input
    id: release
    attributes:
      label: OMP NInfer release
      description: Exact product tag, for example v0.3.0.
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile ID
      description: Exact profile from the manifest.
    validations:
      required: true
  - type: input
    id: client_os
    attributes:
      label: Client OS and architecture
      placeholder: Windows 11 x64, macOS 26 arm64, or Ubuntu 24.04 x64
    validations:
      required: true
  - type: input
    id: runtime_os
    attributes:
      label: Inference-host OS
      placeholder: Ubuntu 24.04 under WSL2
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and reported VRAM
      placeholder: NVIDIA GeForce RTX 5090, 32607 MiB
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: NVIDIA driver and CUDA reported by nvidia-smi
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Runtime stack versions
      description: Docker and NVIDIA Container Toolkit versions, or the exact native package ID.
    validations:
      required: true
  - type: input
    id: omp
    attributes:
      label: OMP version
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Acceptance result
      options:
        - All documented checks passed
        - Text and tools passed; another check failed
        - Installation did not complete
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Observed checks
      options:
        - label: Text and file-tool turn passed
        - label: Image input passed
        - label: Stateful same-session follow-up passed
        - label: OMP exit/resume passed while NInfer stayed alive
        - label: Disconnected tunnel failed closed without a cloud answer
        - label: NInfer process-restart continuation passed (qualified native lane only)
  - type: textarea
    id: notes
    attributes:
      label: Content-safe observations
      description: Include the step and behavior, not prompt/output content or private identifiers.
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I removed secrets, private identifiers, paths, prompts, outputs, raw logs, session data, and any source code I did not deliberately choose to publish.
          required: true
