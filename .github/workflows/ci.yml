name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Release tags verify pinned evidence URLs against the commits they name.
          fetch-depth: ${{ github.ref_type == 'tag' && 0 || 1 }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate manifest and bound contracts
        run: python3 scripts/verify_release.py
      - name: Require the ready contract on release tags
        if: github.ref_type == 'tag'
        run: python3 scripts/verify_release.py --require-ready --check-pins
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse shell launchers
        run: bash -n examples/manual-tunnel/*.sh
