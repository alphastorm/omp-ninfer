name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Suites read immutable guides and evidence from Git history; release tags also
          # verify pinned evidence URLs against the commits they name.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Validate manifest and bound contracts
        run: python3 scripts/verify_release.py
      - name: Require the ready contract on release tags
        if: github.ref_type == 'tag'
        run: python3 scripts/verify_release.py --require-ready --check-pins
      - name: Run contract tests
        run: python3 scripts/run_tests.py
      - name: Parse shell launchers
        run: bash -n examples/manual-tunnel/*.sh

  windows-contract-shards:
    name: windows-contract-shard-${{ matrix.shard }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Parse every host and example PowerShell script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path scripts/hosts -Filter *.ps1 -File)
          $files += @(Get-ChildItem -Path examples -Filter *.ps1 -File -Recurse)
          if ($files.Count -eq 0) { throw 'No PowerShell scripts found' }
          foreach ($f in $files) {
            Write-Host "Parsing $($f.Name)"
            $null = [ScriptBlock]::Create((Get-Content -Raw -LiteralPath $f.FullName))
          }
      - name: Run portable contract suite on native Windows
        run: python scripts/run_tests.py --windows-skips --shard ${{ matrix.shard }}/4

  # Retain the original check name while requiring every matrix child to succeed.
  windows-contract:
    if: ${{ always() }}
    needs: windows-contract-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every native Windows shard
        env:
          SHARD_RESULT: ${{ needs.windows-contract-shards.result }}
        run: test "$SHARD_RESULT" = success

  macos-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Run contract tests
        run: python3 scripts/run_tests.py

  acceptance-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Compose acceptance against disposable host-free evidence
        # The composer has no dry-run mode: its fixtures redirect every write to a temp tree.
        run: python3 scripts/run_tests.py --pattern test_compose_route_acceptance.py
      - name: Plan both native routes without contacting hosts
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          release=$(python3 -c 'import json; print(json.load(open("compatibility.json"))["product_release"])')
          for lane in rtx4090 rtx3090; do
            workspace="$RUNNER_TEMP/acceptance-dry-run-$lane"
            python3 scripts/hosts/accept-rtx4090-route.py \
              --lane "$lane" --release "$release" --candidate "$CANDIDATE" \
              --workspace "$workspace" --remote-workspace C:/ci/acceptance \
              --host no-host.invalid --expected-state-sha256 "$(printf '0%.0s' {1..64})" \
              --temporary-previous ci-predecessor --mode dry-run
            test ! -e "$workspace"
          done
